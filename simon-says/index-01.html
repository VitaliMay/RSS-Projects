<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon say VitaliMay</title>
  <meta name="description" content="Simon Says is an online game for the whole family. The exciting game develops memory and reaction.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css" media="screen">
  <link rel="icon" href="./assets/img/GR__favicon_min.png" type="image/png">
  <script type="module" src="./app.js" crossorigin></script>
</head>
<body>
	<div class="wrapper">
		<header class="header">
      <div class="level">
        <div class="level__easy level__easy_disabled key">easy</div>
        <div class="level__medium level__medium_disabled key">medium</div>
        <div class="level__hard level__hard_active key">hard</div>
      </div>
      <div class="start">
        <h1>Simon Says</h1>
        <div class="key keyboard-space">Start</div>
      </div>
      <div class="info">
        <div class="info__round key key_info key_info-round">5 round</div>
        <div class="info__new-game  key key_info">new game</div>
        <div class="info__repeat  key key_info">Repeat the sequence</div>
      </div>
		</header>
		<main class="main">
      <input type="text" class="input-text" value="wwwwww" readonly>
			<div class="keyboard">
				<div class="keyboard-num"></div>
				<div class="keyboard-letter"></div>
        <!-- <div class="key keyboard-space">Start</div> -->
			</div>
		</main>
	</div>

</body>
</html>
